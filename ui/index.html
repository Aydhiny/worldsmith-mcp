<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Worldsmith — Layout Inspector</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --panel-2: #0e1626;
    --border: #223049;
    --text: #e6edf7;
    --dim: #90a2bf;
    --accent: #38bdf8;
    --accent-2: #0ea5e9;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #facc15;
    --block: #64748b;
    --prop: #38bdf8;
    --enemy: #f87171;
    --collectible: #facc15;
    --hazard: #fb923c;
    --checkpoint: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel-2);
    flex-shrink: 0;
  }
  header img { width: 32px; height: 32px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  .left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  textarea {
    flex: 1; background: var(--panel); color: var(--text); border: none; resize: none;
    padding: 12px; font: 12px/1.5 ui-monospace, "SF Mono", Consolas, monospace; outline: none;
  }
  .toolbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); background: var(--panel-2); }
  button {
    background: var(--accent-2); color: #04202e; border: none; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button:hover { background: var(--accent); }
  button.secondary { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  button.secondary:hover { color: var(--text); border-color: var(--dim); }
  .report {
    max-height: 40%; overflow-y: auto; padding: 10px 12px; border-top: 1px solid var(--border);
    background: var(--panel); font: 12px/1.6 ui-monospace, "SF Mono", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .report.ok { color: var(--good); }
  .report.bad { color: var(--bad); }
  .right { display: flex; flex-direction: column; min-height: 0; }
  .views { flex: 1; display: grid; grid-template-rows: 1fr 1fr; min-height: 0; }
  .view { position: relative; border-bottom: 1px solid var(--border); overflow: hidden; }
  .view:last-child { border-bottom: none; }
  .view .label {
    position: absolute; top: 8px; left: 10px; color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px; z-index: 2; pointer-events: none;
  }
  svg { width: 100%; height: 100%; display: block; }
  .legend {
    display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border);
    background: var(--panel-2); font-size: 11px; color: var(--dim); flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
  <header>
    <img src="../docs/logo.svg" alt="Worldsmith" />
    <div>
      <h1>Worldsmith — Layout Inspector</h1>
      <div class="sub">Paste a LevelLayout, validate it, see it — all client-side, same validator code the MCP server runs.</div>
    </div>
  </header>

  <main>
    <div class="left">
      <textarea id="input" spellcheck="false"></textarea>
      <div class="toolbar">
        <button id="validate">Validate</button>
        <button id="repair" class="secondary">Suggest repairs</button>
        <button id="loadExample" class="secondary">Load example</button>
      </div>
      <div id="report" class="report"></div>
    </div>

    <div class="right">
      <div class="views">
        <div class="view">
          <div class="label">Top-down (X / Z)</div>
          <svg id="viewTop" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="view">
          <div class="label">Side (Z / Y)</div>
          <svg id="viewSide" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--block)"></i> block</span>
        <span><i class="swatch" style="background:var(--prop)"></i> prop</span>
        <span><i class="swatch" style="background:var(--enemy)"></i> enemy</span>
        <span><i class="swatch" style="background:var(--collectible)"></i> collectible</span>
        <span><i class="swatch" style="background:var(--hazard)"></i> hazard</span>
        <span><i class="swatch" style="background:var(--checkpoint)"></i> checkpoint</span>
        <span><i class="swatch" style="background:var(--bad)"></i> overlap</span>
        <span><i class="swatch" style="background:var(--warn)"></i> unreachable</span>
      </div>
    </div>
  </main>

<script type="module">
import { validateLayout, checkOverlaps, checkReachability, suggestOverlapRepairs } from "./vendor/worldsmith-core.js";

const EXAMPLE = {
  id: "entry-hall-example",
  spawn: { x: 0, y: 0.3, z: 4 },
  movement: { gravity: 20, jumpHeight: 4, runSpeed: 8, maxRisePerStep: 2.8, jumpsAvailable: 1 },
  zones: [
    { id: "entry_hall", bounds: { center: { x: 0, y: 4, z: 15 }, size: { x: 16, y: 10, z: 32 } },
      placementIds: ["floor", "wallL", "wallR", "roof", "landing"] }
  ],
  placements: [
    { id: "floor", kind: "block", name: "Entry_Floor", position: { x: 0, y: -0.5, z: 15 }, size: { x: 14, y: 1, z: 30 }, tags: ["floor"] },
    { id: "wallL", kind: "block", name: "Entry_WallL", position: { x: -7.5, y: 4, z: 15 }, size: { x: 1, y: 9, z: 30 } },
    { id: "wallR", kind: "block", name: "Entry_WallR", position: { x: 7.5, y: 4, z: 15 }, size: { x: 1, y: 9, z: 30 } },
    { id: "roof", kind: "block", name: "Entry_Roof", position: { x: 0, y: 8.5, z: 15 }, size: { x: 15, y: 1, z: 30 } },
    { id: "landing", kind: "block", name: "Far_Landing", position: { x: 0, y: 3, z: 20 }, size: { x: 10, y: 1, z: 10 }, tags: ["floor"] }
  ]
};

const $input = document.getElementById("input");
const $report = document.getElementById("report");
const $viewTop = document.getElementById("viewTop");
const $viewSide = document.getElementById("viewSide");

function currentLayout() {
  try { return { ok: true, layout: JSON.parse($input.value) }; }
  catch (e) { return { ok: false, error: e.message }; }
}

function setReport(text, ok) {
  $report.textContent = text;
  $report.className = "report " + (ok ? "ok" : "bad");
}

function kindColor(kind) {
  return getComputedStyle(document.documentElement).getPropertyValue("--" + kind) || "var(--block)";
}

// axis pair: "top" = (x,z), "side" = (z,y)
function render(svg, layout, findings, unreachableIds, axisPair) {
  svg.innerHTML = "";
  const placements = layout.placements || [];
  const zones = layout.zones || [];
  if (placements.length === 0 && zones.length === 0) return;

  const pick = axisPair === "top"
    ? (v) => [v.x, v.z]
    : (v) => [v.z, v.y];

  let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
  const consider = (centerVal, sizeVal) => {
    const [ca, cb] = pick(centerVal), [sa, sb] = pick(sizeVal);
    minA = Math.min(minA, ca - sa / 2); maxA = Math.max(maxA, ca + sa / 2);
    minB = Math.min(minB, cb - sb / 2); maxB = Math.max(maxB, cb + sb / 2);
  };
  for (const p of placements) consider(p.position, p.size);
  for (const z of zones) consider(z.bounds.center, z.bounds.size);
  if (!isFinite(minA)) return;

  const padding = Math.max(2, (maxA - minA) * 0.08);
  minA -= padding; maxA += padding; minB -= padding; maxB += padding;
  const spanA = Math.max(1e-3, maxA - minA), spanB = Math.max(1e-3, maxB - minB);
  const W = 800, H = 800;
  const scale = Math.min(W / spanA, H / spanB);
  const offX = (W - spanA * scale) / 2, offY = (H - spanB * scale) / 2;

  const toX = (a) => offX + (a - minA) * scale;
  // SVG y grows downward; flip B so "up" in the data reads as up on screen.
  const toY = (b) => H - (offY + (b - minB) * scale);

  const ns = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => {
    const n = document.createElementNS(ns, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  for (const zone of zones) {
    const [ca, cb] = pick(zone.bounds.center), [sa, sb] = pick(zone.bounds.size);
    const x = toX(ca - sa / 2), y = toY(cb + sb / 2);
    const w = sa * scale, h = sb * scale;
    svg.appendChild(el("rect", { x, y, width: w, height: h, fill: "none", stroke: "#33415c", "stroke-width": 1.5, "stroke-dasharray": "6 5" }));
  }

  const overlapCentres = findings.map((f) => f.centre);
  for (const p of placements) {
    const [ca, cb] = pick(p.position), [sa, sb] = pick(p.size);
    const x = toX(ca - sa / 2), y = toY(cb + sb / 2);
    const w = Math.max(2, sa * scale), h = Math.max(2, sb * scale);
    const solid = p.solid !== false;
    const isOverlapping = findings.some((f) => f.a === p.id || f.b === p.id);
    const isUnreachable = unreachableIds.has(p.id);
    const fill = kindColor(p.kind).trim() || "#64748b";

    svg.appendChild(el("rect", {
      x, y, width: w, height: h, fill,
      opacity: solid ? 0.85 : 0.35,
      stroke: isOverlapping ? "var(--bad)" : (isUnreachable ? "var(--warn)" : "none"),
      "stroke-width": (isOverlapping || isUnreachable) ? 2.5 : 0,
    }));

    const title = el("title", {});
    title.textContent = `${p.name} (${p.kind})`;
    svg.lastChild.appendChild(title);
  }

  for (const c of overlapCentres) {
    const [ca, cb] = pick(c);
    const x = toX(ca), y = toY(cb);
    const s = 6;
    svg.appendChild(el("line", { x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: "var(--bad)", "stroke-width": 2 }));
    svg.appendChild(el("line", { x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: "var(--bad)", "stroke-width": 2 }));
  }

  // spawn marker
  const [sa2, sb2] = pick(layout.spawn ?? { x: 0, y: 0, z: 0 });
  const sx = toX(sa2), sy = toY(sb2);
  svg.appendChild(el("circle", { cx: sx, cy: sy, r: 5, fill: "var(--accent)" }));
}

function run(withRepairSuggestions) {
  const parsed = currentLayout();
  if (!parsed.ok) { setReport("Not valid JSON:\n" + parsed.error, false); return; }

  const layout = parsed.layout;
  const report = validateLayout(layout);
  const findings = checkOverlaps(layout);
  const reach = checkReachability(layout);
  const unreachableIds = new Set(reach.unreachable.map((u) => u.placementId));

  let text = report.summary;
  if (withRepairSuggestions && findings.length > 0) {
    const suggestions = suggestOverlapRepairs(layout, findings);
    text += "\n\nSuggested repairs:\n" + suggestions.map((s) =>
      `  ${s.placementName}: move ${s.axis} by ${s.delta >= 0 ? "+" : ""}${s.delta.toFixed(2)}m — ${s.reason}`
    ).join("\n");
  }
  setReport(text, report.ok);

  render($viewTop, layout, findings, unreachableIds, "top");
  render($viewSide, layout, findings, unreachableIds, "side");
}

document.getElementById("validate").addEventListener("click", () => run(false));
document.getElementById("repair").addEventListener("click", () => run(true));
document.getElementById("loadExample").addEventListener("click", () => {
  $input.value = JSON.stringify(EXAMPLE, null, 2);
  run(false);
});

$input.value = JSON.stringify(EXAMPLE, null, 2);
run(false);
</script>
</body>
</html>
